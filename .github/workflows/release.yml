name: Publish installers as a GitHub Release

# The site's download buttons point at this release, so GitHub counts every
# download. Runs when the installers or .github/release.json change, or by hand
# (Actions -> this workflow -> Run workflow). It creates release v<version>
# and uploads every installer in downloads/ for that version, after checking
# each Windows installer against the SHA-256 in .github/release.json.
# Files already on the release are left alone, so download counts are kept, unless the
# file in downloads/ itself changed (a rebuilt installer under the same version).
on:
  push:
    branches: [main]
    paths: ['.github/release.json', 'downloads/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(python3 -c "import json;print(json.load(open('.github/release.json'))['version'])")
          TAG="v$VER"
          # During a release the new installers land here a minute before release.json
          # catches up; wait for that push instead of failing (and emailing a failure)
          MISSING=$(python3 -c "import json,os;r=json.load(open('.github/release.json'));print(' '.join(f['setup'] for f in r['files'].values() if not os.path.exists('downloads/'+f['setup'])))")
          if [ -n "$MISSING" ]; then echo "::notice::release.json ($VER) lists installers not in downloads/ yet ($MISSING); the next publish will run this again"; exit 0; fi
          # check the Windows installers against release.json before publishing
          python3 - <<'EOF'
          import json, hashlib, sys
          r = json.load(open('.github/release.json'))
          for f in r['files'].values():
              h = hashlib.sha256(open('downloads/' + f['setup'], 'rb').read()).hexdigest()
              if h != f['sha256']:
                  sys.exit(f"SHA-256 mismatch for {f['setup']}")
              print('ok', f['setup'])
          EOF
          shopt -s nullglob
          FILES=(downloads/*-"$VER"-*)
          [ ${#FILES[@]} -gt 0 ] || { echo "No installers for $VER in downloads/"; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MasterScope tools $VER" \
              --notes "Free installers for Liminal, MasterScope Meter and the MasterScope Full Suite. What's new: https://masterscope.gwstudio.com.au/changelog/ · Download page: https://masterscope.gwstudio.com.au/liminal/"
          fi
          HAVE=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in "${FILES[@]}"; do
            n=$(basename "$f")
            if grep -qxF "$n" <<<"$HAVE"; then
              # A file that changed in downloads/ on purpose (a rebuilt installer under the same
              # version) replaces the release copy; that resets its download count, so only then.
              info=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q ".assets[] | select(.name == \"$n\") | \"\(.digest // \"\") \(.size)\"")
              dig=${info% *}; size=${info##* }
              local_sha="sha256:$(sha256sum "$f" | cut -d' ' -f1)"; local_size=$(stat -c %s "$f")
              if { [ -n "$dig" ] && [ "$dig" != "$local_sha" ]; } || { [ -z "$dig" ] && [ "$size" != "$local_size" ]; }; then
                gh release upload "$TAG" "$f" --clobber; echo "::notice::replaced $n (the file in downloads/ changed; its download count restarts)"
              else echo "already there: $n"; fi
            else gh release upload "$TAG" "$f"; echo "uploaded: $n"; fi
          done
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) bytes  \(.download_count) downloads"'
