name: IndexNow

# Tells Bing (and other IndexNow search engines) which pages changed, so they
# re-crawl them within hours instead of weeks. Runs after every push to main:
# it waits for GitHub Pages to publish, then submits the changed pages.
# A commit message containing [indexnow-all], or Actions -> IndexNow -> Run
# workflow, submits every page in sitemap.xml instead.
#
# The key file at the site root (<key>.txt) proves the site is ours.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://masterscope.gwstudio.com.au
  KEY: 3689232d704a14b7fe577b516af0b4d2

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which pages changed
        id: urls
        env:
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || printf '%s' "$MSG" | grep -q '\[indexnow-all\]'; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -E 's#</?loc>##g' > urls.txt
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git rev-parse HEAD~1)
            fi
            git diff --name-only --diff-filter=AMR "$BEFORE" HEAD > changed.txt
            : > urls.txt
            while read -r f; do
              case "$f" in
                index.html) echo "$SITE/" ;;
                404.html) ;;
                */index.html) echo "$SITE/${f%index.html}" ;;
                downloads/*) echo "$SITE/${f}" ;;
              esac
            done < changed.txt >> urls.txt
            # A new download changes what its product page offers
            grep -q '^downloads/Liminal' changed.txt && echo "$SITE/liminal/" >> urls.txt || true
            grep -q '^downloads/MasterScope-Meter' changed.txt && echo "$SITE/meter/" >> urls.txt || true
            # Only submit pages listed in the sitemap (skips downloads and hidden pages)
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -E 's#</?loc>##g' | sort -u > sitemap-urls.txt
            sort -u urls.txt | comm -12 - sitemap-urls.txt > urls-in-sitemap.txt
            mv urls-in-sitemap.txt urls.txt
          fi
          sort -u -o urls.txt urls.txt
          echo "count=$(wc -l < urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Pages to submit:"; cat urls.txt

      - name: Wait for GitHub Pages to publish
        if: steps.urls.outputs.count != '0'
        run: |
          # Submit only once the new version is live, so crawlers fetch the new pages
          for i in $(seq 1 30); do
            if curl -sf "$SITE/$KEY.txt" | grep -q "$KEY"; then break; fi
            echo "Key file not live yet..."; sleep 10
          done
          sleep 90

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          set -e
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          site, key = os.environ["SITE"], os.environ["KEY"]
          urls = [u.strip() for u in open("urls.txt") if u.strip()][:10000]
          body = json.dumps({"host": site.split("//")[1], "key": key,
                             "keyLocation": f"{site}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/IndexNow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              code = urllib.request.urlopen(req, timeout=30).status
          except urllib.error.HTTPError as e:
              code = e.code
          meaning = {200: "accepted", 202: "accepted (key being checked)", 400: "bad request",
                     403: "key not valid", 422: "URLs don't match the site", 429: "too many requests"}
          print(f"::notice::IndexNow: {len(urls)} page(s) submitted, HTTP {code} {meaning.get(code, '')}")
          raise SystemExit(0 if code in (200, 202) else 1)
          EOF
